[package]
name = "voxel"
version = "0.1.0"
description = "VOXEL Voice to Music Studio"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.3", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
